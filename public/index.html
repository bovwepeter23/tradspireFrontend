<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradspire</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="./css/index.css">
  <link rel="stylesheet" href="./css/footer.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="topbar" data-app-topbar></header>

  <div class="layout-body">
    <aside class="sidebar" data-app-sidebar></aside>

    <main class="main-content">
      <!-- <p class="eyebrow">Your marketplace</p>
      <h1>TRADSPIRE</h1> -->
      <section class="featured-section" aria-labelledby="featuredTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Made to be discovered</p>
            <h2 id="featuredTitle">Featured finds</h2>
          </div>
          <div class="carousel-controls" aria-label="Featured products">
            <button class="carousel-arrow" type="button" data-carousel-previous aria-label="Previous product"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
            <button class="carousel-arrow" type="button" data-carousel-next aria-label="Next product"><i data-lucide="arrow-right" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="carousel-slide" data-carousel-slide aria-live="polite"></div>
        <div class="carousel-footer">
          <div class="carousel-dots" data-carousel-dots aria-label="Choose a featured product"></div>
          <p class="carousel-count" data-carousel-count></p>
        </div>
      </section>
      <section class="home-categories" aria-labelledby="homeCategoriesTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Explore by tradition</p>
            <h2 id="homeCategoriesTitle">Shop categories</h2>
          </div>
        </div>
        <div class="category-rail" data-home-category-list aria-label="Main product categories">
          <p class="empty-state">Loading categories...</p>
        </div>
      </section>
      <section class="storefront-products" aria-labelledby="storefrontProductsTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Shop the collection</p>
            <h2 id="storefrontProductsTitle" data-home-products-title>All products</h2>
          </div>
          <a class="text-link" href="html/products.html">Browse catalog</a>
        </div>
        <div class="product-grid" data-product-grid data-home-product-grid aria-live="polite">
          <p class="empty-state">Loading products...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/index.js"></script>
  <script src="./js/carousel.js"></script>
  <script src="./js/catalog.js"></script>
  <script src="./js/footer.js"></script>
</body>
</html>
