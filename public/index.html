<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tradspire - Authentication</title>
  <link rel="stylesheet" href="./css/index.css" />
</head>
<body>
  <div class="auth-container">
    <!-- Header / Brand -->
    <div class="brand-header">
      <h1 class="brand-title">TRADSPIRE</h1>
      <p class="brand-subtitle">PRESERVING CULTURAL VALUES</p>
    </div>

    <!-- Tab Buttons -->
    <div class="auth-tabs" id="authTabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Alert / Message Banner -->
    <div id="alertBox" class="alert-box hidden"></div>

    <!-- 1. LOGIN FORM -->
    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" placeholder="user@example.com" required />
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>

      <div class="form-actions">
        <a href="#" class="forgot-link" onclick="switchTab('recover')">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-submit">Login</button>
    </form>

    <!-- 2. REGISTER FORM -->
    <form id="registerForm" class="auth-form hidden">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="John Doe" required />
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="user@example.com" required />
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <!-- 3. RECOVER PASSWORD FORM -->
    <form id="recoverForm" class="auth-form hidden">
      <p class="form-desc">Enter your email address and we'll send you instructions to reset your password.</p>
      
      <div class="form-group">
        <label for="recoverEmail">Email Address</label>
        <input type="email" id="recoverEmail" placeholder="user@example.com" required />
      </div>

      <button type="submit" class="btn-submit">Send Reset Link</button>
      
      <div class="form-actions center">
        <a href="#" class="forgot-link" onclick="switchTab('login')">Back to Login</a>
      </div>
    </form>
  </div>

  <script src="./js/index.js"></script>
</body>
</html>
