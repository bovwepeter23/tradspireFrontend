<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Tradspire</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/footer.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="topbar" data-app-topbar></header>
  <div class="layout-body">
    <aside class="sidebar" data-app-sidebar></aside>
    <main class="main-content">
      <p class="eyebrow">Your account</p>
      <h1>Your cart</h1>
      <p class="page-description">Review your items before placing your order.</p>
      <p class="cart-message" data-cart-message role="status" aria-live="polite"></p>
      <div class="cart-layout">
        <section class="cart-items" aria-label="Cart items" data-cart-items>
          <p class="empty-state">Loading cart...</p>
        </section>
        <aside class="cart-checkout" aria-label="Checkout">
          <button id="placeOrderButton" class="checkout-submit" type="button">Place order</button>
          <a class="checkout-login" data-cart-login href="login.html" hidden>Sign in to place an order</a>
        </aside>
      </div>
      <dialog class="order-confirm-dialog" data-order-dialog aria-labelledby="orderDialogTitle" aria-describedby="orderDialogDescription">
        <div class="order-confirm-content">
          <div class="order-confirm-heading">
            <div>
              <p class="eyebrow">Order summary</p>
              <h2 id="orderDialogTitle">Confirm your order</h2>
            </div>
            <button class="order-confirm-close" type="button" data-close-order-dialog aria-label="Close order confirmation">
              <i data-lucide="x" aria-hidden="true"></i>
            </button>
          </div>
          <p id="orderDialogDescription" class="order-confirm-description">Review your estimated total and payment method before placing your order.</p>
          <div class="order-estimate-row">
            <span>Estimated total</span>
            <strong data-order-estimate>₦0.00</strong>
          </div>
          <fieldset class="order-payment-methods">
            <legend>Payment method</legend>
            <label class="order-payment-option">
              <input type="radio" name="paymentMethod" value="pay-on-delivery" checked>
              <span><strong>Pay on Delivery</strong><small>Pay when your order arrives</small></span>
            </label>
            <label class="order-payment-option is-unavailable" aria-disabled="true">
              <input type="radio" name="paymentMethod" value="pay-online" disabled>
              <span><strong>Pay Online</strong><small>Unavailable</small></span>
            </label>
          </fieldset>
          <p class="order-dialog-message" data-order-dialog-message role="status" aria-live="polite"></p>
          <div class="order-confirm-actions">
            <button class="order-back-button" type="button" data-close-order-dialog>Back to cart</button>
            <button class="checkout-submit" type="button" data-confirm-order>Confirm order</button>
          </div>
        </div>
      </dialog>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/index.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/footer.js"></script>
</body>
</html>
