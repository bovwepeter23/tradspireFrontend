<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | Tradspire</title>
  <link rel="stylesheet" href="../css/index.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="topbar" data-app-topbar></header>
  <div class="layout-body">
    <aside class="sidebar" data-app-sidebar></aside>
    <main class="main-content">
      <p class="eyebrow">Your account</p>
      <h1>Orders</h1>
      <p class="page-description">Track delivery progress and manage orders that have not shipped.</p>
      <p class="order-message" data-order-message role="status" aria-live="polite"></p>
      <div class="orders-list" data-orders-list aria-live="polite">
        <p class="empty-state">Loading orders...</p>
      </div>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/index.js"></script>
  <script src="../js/orders.js"></script>
</body>
</html>
