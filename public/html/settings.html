<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Tradspire</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="../css/index.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="topbar" data-app-topbar></header>
  <div class="layout-body">
    <aside class="sidebar" data-app-sidebar></aside>
    <main class="main-content">
      <p class="eyebrow">Your account</p>
      <h1>Settings</h1>
      <p class="page-description">Manage your personal details, delivery address, and password.</p>
      <p class="account-message" data-settings-message role="status" aria-live="polite"></p>
      <form class="account-form" id="profileForm">
        <details class="settings-disclosure">
          <summary>Personal details</summary>
          <div class="settings-disclosure-content">
            <label for="profileName">Full name</label>
            <input id="profileName" name="name" type="text" autocomplete="name" maxlength="120" required>
            <label for="profileEmail">Email address</label>
            <input id="profileEmail" name="email" type="email" autocomplete="email" readonly>
          </div>
        </details>
        <details class="settings-disclosure">
          <summary>Delivery address</summary>
          <div class="settings-disclosure-content">
            <div class="account-form-grid">
              <div>
                <label for="addressFullName">Recipient name</label>
                <input id="addressFullName" name="fullName" type="text" autocomplete="shipping name" maxlength="120" required>
              </div>
              <div>
                <label for="addressPhone">Phone number</label>
                <input id="addressPhone" name="phone" type="tel" autocomplete="shipping tel" maxlength="40" required>
              </div>
            </div>
            <label for="addressLine1">Street address</label>
            <input id="addressLine1" name="addressLine1" type="text" autocomplete="shipping address-line1" maxlength="160" required>
            <label for="addressLine2">Apartment, suite, etc. (optional)</label>
            <input id="addressLine2" name="addressLine2" type="text" autocomplete="shipping address-line2" maxlength="160">
            <div class="account-form-grid account-form-grid-four">
              <div>
                <label for="addressCity">City</label>
                <input id="addressCity" name="city" type="text" autocomplete="shipping address-level2" maxlength="100" required>
              </div>
              <div>
                <label for="addressRegion">State / region</label>
                <input id="addressRegion" name="region" type="text" autocomplete="shipping address-level1" maxlength="100" required>
              </div>
              <div>
                <label for="addressPostalCode">Postal code</label>
                <input id="addressPostalCode" name="postalCode" type="text" autocomplete="shipping postal-code" maxlength="24" required>
              </div>
              <div>
                <label for="addressCountry">Country</label>
                <input id="addressCountry" name="country" type="text" autocomplete="shipping country-name" maxlength="80" required>
              </div>
            </div>
          </div>
        </details>
        <button class="text-button" type="submit">Save profile</button>
      </form>
      <form class="account-form" id="passwordForm">
        <details class="settings-disclosure">
          <summary>Change password</summary>
          <div class="settings-disclosure-content">
            <label for="currentPassword">Current password</label>
            <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
            <label for="newPassword">New password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
            <button class="text-button" type="submit">Update password</button>
          </div>
        </details>
      </form>
      <button class="text-button" id="logoutButton" type="button">Log out</button>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/index.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
