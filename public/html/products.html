<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Tradspire</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="../css/index.css?v=20261014-2">
  <link rel="stylesheet" href="../css/footer.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="topbar" data-app-topbar></header>
  <div class="layout-body">
    <aside class="sidebar" data-app-sidebar></aside>
    <main class="main-content">
      <p class="eyebrow">Marketplace</p>
      <h1>Products</h1>
      <p class="page-description">Browse goods and creations from our community.</p>
      <form class="catalog-filters" data-catalog-form role="search">
        <label class="catalog-search-label" for="catalogSearch">Search by product name</label>
        <div class="catalog-search-row">
          <input id="catalogSearch" name="search" type="search" maxlength="120" placeholder="Search products">
          <button class="text-button" type="submit">Search</button>
        </div>
        <div class="catalog-category-filters">
          <div>
            <label for="catalogMainCategory">Main category</label>
            <select id="catalogMainCategory" name="categoryId">
              <option value="">All main categories</option>
            </select>
          </div>
          <div>
            <label for="catalogSubCategory">Subcategory</label>
            <select id="catalogSubCategory" name="subCategoryId" disabled>
              <option value="">All subcategories</option>
            </select>
          </div>
        </div>
      </form>
      <p class="catalog-result-count" data-catalog-result-count role="status"></p>
      <div class="product-grid" data-product-grid aria-live="polite">
        <p class="empty-state">Loading products...</p>
      </div>
    </main>
  </div>
  <script src="../js/api.js?v=20261014-2"></script>
  <script src="../js/index.js?v=20261014-2"></script>
  <script src="../js/catalog.js"></script>
  <script src="../js/footer.js"></script>
</body>
</html>
