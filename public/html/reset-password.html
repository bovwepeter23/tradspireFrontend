<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>Reset Password | Tradspire</title>
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/reset-password.css">
</head>
<body>
  <main class="auth-container reset-container">
    <header class="brand-header">
      <a class="brand-title" href="../index.html">TRADSPIRE</a>
      <p class="brand-subtitle">PRESERVING CULTURAL VALUES</p>
    </header>

    <section class="reset-content" aria-labelledby="resetHeading">
      <p class="reset-eyebrow">Account recovery</p>
      <h1 id="resetHeading">Choose a new password</h1>
      <p class="form-desc">Set a new password for your Tradspire account.</p>

      <div id="alertBox" class="alert-box hidden" role="alert" aria-live="polite"></div>

      <form id="resetForm" class="auth-form">
        <div class="form-group">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="6" required>
          <span class="field-hint">Use at least 6 characters.</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
        </div>

        <button id="submitButton" class="btn-submit" type="submit">Update password</button>
      </form>

      <a id="loginLink" class="login-link" href="../index.html" hidden>Return to login</a>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
